<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Buffalo Remixed</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet" />

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #ffffff;
      font-family: Arial, Helvetica, sans-serif;
      color: #111111;
    }

   a {
  cursor: pointer;
  text-decoration: none;
}

a:hover img {
  transform: scale(1.012);
  filter: brightness(0.97);
}

    img {
      display: block;
      width: 100%;
      height: auto;
    }

    .site-header {
  width: 100%;
  padding: 14px 20px;
  text-align: center;
  background: #ffffff;
     }

.site-header-text {
  margin: 0;
  font-family: "Uni Sans", "Arial Black", Arial, Helvetica, sans-serif;
  font-size: 18px;
  font-weight: 900;
  letter-spacing: 1px;
  text-transform: uppercase;
  color: #c8102e;
    }

    .site-header-subtext {
  margin: 6px 0 0;
  font-family: "Inter", Arial, Helvetica, sans-serif;
  font-size: 14px;
  font-weight: 500;
  letter-spacing: 0.2px;
  color: #003DA5;
  text-align: center;
}
    
.site-footer {
  width: 100%;
  padding: 26px 20px 34px;
  text-align: center;
  background: #ffffff;
     }

.site-footer-text {
  margin: 0;
  font-family: "Inter", Arial, Helvetica, sans-serif;
  font-size: 14px;
  font-weight: 600;
  letter-spacing: 0.3px;
  color: #c8102e;
}

    /* IMAGE 1: FULL-WIDTH TOP BANNER */
    .hero {
  width: 100%;
  display: block;
  overflow: visible;
  background: #ffffff;
}

    .hero img {
  width: 100%;
  height: auto;
  max-height: none;
  object-fit: contain;
  object-position: center center;
}

    /* MAIN CONTENT WIDTH */
    .section {
      width: 100%;
      max-width: 1250px;
      margin: 0 auto;
      padding: 36px 24px;
    }

    /* IMAGES 2, 3, 4: THREE ACROSS */
    .three-across {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 34px;
      align-items: center;
    }

    .product-tile {
      width: 100%;
      background: #ffffff;
      overflow: hidden;
    }

    .product-tile img {
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: contain;
      background: #ffffff;
    }

    /* IMAGE 5: FULL-WIDTH BANNER */
    .wide-banner {
  width: 100%;
  display: block;
  overflow: visible;
  background: #ffffff;
}

.wide-banner img {
  width: 100%;
  height: auto;
  max-height: none;
  object-fit: contain;
  object-position: center center;
}

    /* IMAGES 6, 7: TWO ACROSS */
    .two-across {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 42px;
      align-items: center;
    }

    .hoodie-tile img {
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: contain;
      background: #ffffff;
    }

    /* IMAGE 8: BIG CENTERED CAMO HAT */
    .featured-hat-section {
  width: 100%;
  max-width: 1200px;
  margin: 0 auto;
  padding: 20px 24px 70px;
  text-align: center;
  overflow: visible;
}

.featured-hat-section a {
  display: block;
  width: 100%;
  text-align: center;
  text-decoration: none;
  color: inherit;
}

.featured-hat-section a:hover {
  text-decoration: none;
}

.featured-hat-section img {
  width: 100%;
  max-width: 650px;
  margin: 0 auto;
  object-fit: contain;
  background: #ffffff;
  transition: transform 0.2s ease, opacity 0.2s ease;
}

.featured-hat-section a:hover img {
  transform: scale(1.012);
  opacity: 0.96;
}

.variant-text {
  width: 100%;
  max-width: 1100px;
  margin: 34px auto 0;
  padding: 0 24px;
  display: block;
  text-align: center;
  font-family: "Uni Sans", "Arial Black", Arial, Helvetica, sans-serif;
  font-size: clamp(13px, 1.25vw, 19px);
  font-weight: 900;
  line-height: 1.25;
  letter-spacing: 0.5px;
  color: #003DA5;
  text-transform: uppercase;
  white-space: nowrap;
  overflow: hidden;
  text-decoration: none;
}
    
    @media (max-width: 600px) {
  .variant-text {
    white-space: normal;
    font-size: 16px;
    line-height: 1.35;
    padding: 0 16px;
  }
}

    /* SIMPLE HOVER EFFECT */
    a img {
      transition: transform 0.2s ease, opacity 0.2s ease;
    }

    a:hover img {
      transform: scale(1.015);
      opacity: 0.96;
    }

    /* MOBILE LAYOUT */
    @media (max-width: 850px) {
      .section {
        padding: 24px 16px;
      }

      .three-across {
        grid-template-columns: 1fr;
        gap: 24px;
      }

      .two-across {
        grid-template-columns: 1fr;
        gap: 28px;
      }

      .hero img {
        max-height: none;
      }

      .wide-banner img {
        max-height: none;
      }

      .variant-text {
        font-size: 22px;
      }
    }
  </style>
</head>

<body>

  <main class="page">

    <header class="site-header">
  <p class="site-header-text">Limited-run fan-inspired designs</p>
  <p class="site-header-subtext">Custom apparel and accessories, available through Spock Shop on eBay.</p>
</header>
    
    <!-- IMAGE 1: FULL TOP BANNER, CLICKABLE -->
    <a class="hero" href="https://www.ebay.com/itm/358572032914" target="_blank" rel="noopener noreferrer">
      <img src="images/image1.jpg" alt="alt="Shop the Buffalo Remixed game day gear collection on eBay" />
    </a>

    <!-- IMAGES 2, 3, 4: THREE RECTANGLES, NO BORDER, EVENLY SPACED -->
    <section class="section">
      <div class="three-across">

        <a class="product-tile" href="https://www.ebay.com/itm/358580955240" target="_blank" rel="noopener noreferrer">
          <img src="images/image2.jpg" alt="Shop the navy fan-inspired hat on eBay" />
        </a>

        <a class="product-tile" href="https://www.ebay.com/itm/358572032914" target="_blank" rel="noopener noreferrer">
          <img src="images/image3.jpg" alt="Shop the red fan-inspired T-shirt on eBay" />
        </a>

        <a class="product-tile" href="https://www.ebay.com/itm/358571638092" target="_blank" rel="noopener noreferrer">
          <img src="images/image4.jpg" alt="Shop the white fan-inspired T-shirt on eBay" />
        </a>

      </div>
    </section>

    <!-- IMAGE 5: FULL-WIDTH CLICKABLE BANNER -->
    <a class="wide-banner" href="https://www.ebay.com/itm/358571892024" target="_blank" rel="noopener noreferrer">
      <img src="images/image5.jpg" alt="Shop the Ice Age Collection hoodies and cold-weather gear on eBay" />
    </a>

    <!-- IMAGES 6 AND 7: TWO RECTANGLES, EVENLY SPACED -->
    <section class="section">
      <div class="two-across">

        <a class="hoodie-tile" href="https://www.ebay.com/itm/358571935858" target="_blank" rel="noopener noreferrer">
          <img src="images/image6.jpg" alt="Shop the navy Champion x Buffalo text hoodie on eBay" />
        </a>

        <a class="hoodie-tile" href="https://www.ebay.com/itm/358571892024" target="_blank" rel="noopener noreferrer">
          <img src="images/image7.jpg" alt="Shop the royal blue Icy Buffalo graphic hoodie on eBay" />
        </a>

      </div>
    </section>

    <!-- IMAGE 8: BIGGER CENTERED CAMO HAT WITH TEXT -->
    <section class="featured-hat-section">
      <a href="https://www.ebay.com/itm/358580955240" target="_blank" rel="noopener noreferrer">
        <img src="images/image8.jpg" alt="Shop the camo fan-inspired hat with multiple variants on eBay" />
        <div class="variant-text">Made to order • Multiple variants available • Secure checkout through eBay</div>
      </a>
    </section>

<footer class="site-footer">
  <p class="site-footer-text">© 2026 Spock Shop</p>
</footer>
    
  </main>

</body>
</html>
